name: Cleanup Orphaned VM Resources

on:
  workflow_dispatch:
    inputs:
      confirmCleanup:
        description: 'Type CLEANUP to confirm orphaned resource cleanup'
        required: true
        type: string
      dryRun:
        description: 'Only report orphaned resources without deleting them'
        required: true
        type: boolean
        default: true
      resourceGroups:
        description: 'Comma-separated resource groups to check (e.g., RG1,RG2)'
        required: false
        default: 'op6-0-ctx-rg'

  repository_dispatch:
    types:
      - cleanup-orphaned-vms

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUPS: ${{ github.event.inputs.resourceGroups || github.event.client_payload.resourceGroups }}
  DRY_RUN: ${{ github.event.inputs.dryRun || github.event.client_payload.dryRun }}
  CONFIRM_CLEANUP: ${{ github.event.inputs.confirmCleanup || github.event.client_payload.confirmCleanup }}

jobs:
  cleanup-orphaned-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Validate cleanup confirmation
        shell: pwsh
        run: |
          if ('${{ env.CONFIRM_CLEANUP }}' -ne 'CLEANUP') {
            throw 'Cleanup cancelled. You must type CLEANUP exactly.'
          }

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Find and remove orphaned VM resources
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            $dryRun = [System.Convert]::ToBoolean('${{ env.DRY_RUN }}')
            $resourceGroups = '${{ env.RESOURCE_GROUPS }}' -split '[, ]+' | Where-Object { $_ -ne '' }

            $summary = @()

            foreach ($resourceGroup in $resourceGroups) {
              Write-Output "Processing Resource Group: $resourceGroup"

              $vms = @(Get-AzVM -ResourceGroupName $resourceGroup)
              $allNics = @(Get-AzNetworkInterface -ResourceGroupName $resourceGroup)
              $attachedNicIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              $attachedDiskIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)

              foreach ($vm in $vms) {
                foreach ($nic in @($vm.NetworkProfile.NetworkInterfaces)) {
                  if ($nic.Id) { [void]$attachedNicIds.Add($nic.Id) }
                }

                if ($vm.StorageProfile.OsDisk.ManagedDisk.Id) {
                  [void]$attachedDiskIds.Add($vm.StorageProfile.OsDisk.ManagedDisk.Id)
                }

                foreach ($dataDisk in @($vm.StorageProfile.DataDisks)) {
                  if ($dataDisk.ManagedDisk.Id) { [void]$attachedDiskIds.Add($dataDisk.ManagedDisk.Id) }
                }
              }

              $orphanedNics = @($allNics | Where-Object {
                -not $_.VirtualMachine -and -not $attachedNicIds.Contains($_.Id)
              })

              $attachedPublicIpIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              $attachedNsgIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              foreach ($nic in $allNics) {
                if ($orphanedNics.Id -contains $nic.Id) { continue }

                if ($nic.NetworkSecurityGroup.Id) {
                  [void]$attachedNsgIds.Add($nic.NetworkSecurityGroup.Id)
                }

                foreach ($ipConfiguration in @($nic.IpConfigurations)) {
                  if ($ipConfiguration.PublicIpAddress.Id) {
                    [void]$attachedPublicIpIds.Add($ipConfiguration.PublicIpAddress.Id)
                  }
                }
              }

              $orphanedPublicIps = @(Get-AzPublicIpAddress -ResourceGroupName $resourceGroup | Where-Object {
                -not $_.IpConfiguration -and -not $attachedPublicIpIds.Contains($_.Id)
              })

              $orphanedDisks = @(Get-AzDisk -ResourceGroupName $resourceGroup | Where-Object {
                -not $_.ManagedBy -and -not $attachedDiskIds.Contains($_.Id)
              })

              $vnets = @(Get-AzVirtualNetwork -ResourceGroupName $resourceGroup)
              foreach ($vnet in $vnets) {
                foreach ($subnet in @($vnet.Subnets)) {
                  if ($subnet.NetworkSecurityGroup.Id) {
                    [void]$attachedNsgIds.Add($subnet.NetworkSecurityGroup.Id)
                  }
                }
              }

              $orphanedNsgs = @(Get-AzNetworkSecurityGroup -ResourceGroupName $resourceGroup | Where-Object {
                -not $attachedNsgIds.Contains($_.Id)
              })

              Write-Output "RG $resourceGroup -> Existing VMs: $($vms.Count)"
              Write-Output "Orphaned NICs: $($orphanedNics.Count), Public IPs: $($orphanedPublicIps.Count), Disks: $($orphanedDisks.Count), NSGs: $($orphanedNsgs.Count)"

              $summary += [pscustomobject]@{
                ResourceGroup = $resourceGroup
                NICs = $orphanedNics.Count
                PublicIPs = $orphanedPublicIps.Count
                Disks = $orphanedDisks.Count
                NSGs = $orphanedNsgs.Count
              }

              if ($dryRun) { continue }

              foreach ($nic in $orphanedNics) { Remove-AzNetworkInterface -ResourceGroupName $resourceGroup -Name $nic.Name -Force }
              foreach ($publicIp in $orphanedPublicIps) { Remove-AzPublicIpAddress -ResourceGroupName $resourceGroup -Name $publicIp.Name -Force }
              foreach ($disk in $orphanedDisks) { Remove-AzDisk -ResourceGroupName $resourceGroup -DiskName $disk.Name -Force }
              foreach ($nsg in $orphanedNsgs) { Remove-AzNetworkSecurityGroup -ResourceGroupName $resourceGroup -Name $nsg.Name -Force }
            }

            $summary | Export-Csv -Path cleanup-summary.csv -NoTypeInformation
            Write-Output "Summary report written to cleanup-summary.csv"
