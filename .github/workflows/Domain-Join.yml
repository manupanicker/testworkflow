name: Join VM to alphaq.com

on:
  workflow_dispatch:
    inputs:
      vmName:
        description: 'Azure VM name to domain join'
        required: true
        type: string
        default: 'win2022-test'

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: CITRIX_BUILD
  DOMAIN_NAME: alphaq.com
  DNS_SERVER: 172.16.0.4

jobs:
  domain-join:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify VM exists
        shell: pwsh
        run: |
          $vm = Get-AzVM -ResourceGroupName "$env:RESOURCE_GROUP" -Name "${{ inputs.vmName }}" -ErrorAction Stop
          Write-Output "Found VM: $($vm.Name)"

      - name: Run domain join script on VM
        uses: azure/powershell@v2
        env:
          ALPHAQ_DOMAIN_JOIN_USERNAME: ${{ secrets.ALPHAQ_DOMAIN_JOIN_USERNAME }}
          ALPHAQ_DOMAIN_JOIN_PASSWORD: ${{ secrets.ALPHAQ_DOMAIN_JOIN_PASSWORD }}
        with:
          azPSVersion: latest
          inlineScript: |
            if ([string]::IsNullOrWhiteSpace($env:ALPHAQ_DOMAIN_JOIN_USERNAME) -or [string]::IsNullOrWhiteSpace($env:ALPHAQ_DOMAIN_JOIN_PASSWORD)) {
              throw "Domain join credentials are not configured."
            }

            $parameters = @{
              DomainName     = $env:DOMAIN_NAME
              DomainUsername = $env:ALPHAQ_DOMAIN_JOIN_USERNAME
              DomainPassword = $env:ALPHAQ_DOMAIN_JOIN_PASSWORD
            }

            Write-Output "Executing Scripts/Domain-Join.ps1 on ${{ inputs.vmName }}..."

            Invoke-AzVMRunCommand `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName "${{ inputs.vmName }}" `
              -CommandId 'RunPowerShellScript' `
              -ScriptPath './Scripts/Domain-Join.ps1' `
              -Parameter $parameters
