name: Grant Citrix Media Blob Access

on:
  workflow_dispatch:
    inputs:
      principal_object_id:
        description: 'Object ID of the Citrix build/deployment managed identity'
        required: true
        type: string
      storage_account_name:
        description: 'Storage account containing Citrix media'
        required: false
        default: 'ctxmedia'
        type: string
      resource_group_name:
        description: 'Resource group containing the storage account'
        required: false
        default: 'Citrix_Build'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  grant-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Grant Blob Reader Access
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            & '${{ github.workspace }}/Scripts/Grant-CitrixMediaBlobAccess.ps1' `
              -StorageAccountName '${{ inputs.storage_account_name }}' `
              -ResourceGroupName '${{ inputs.resource_group_name }}' `
              -PrincipalObjectId '${{ inputs.principal_object_id }}'
          errorActionPreference: Stop
          failOnStandardError: true
