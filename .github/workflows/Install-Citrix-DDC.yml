name: Install Citrix Delivery Controller

on:
  workflow_dispatch:
    inputs:
      vmName:
        description: 'Existing Azure VM name'
        required: true
        type: string
      installSqlExpress:
        description: 'Install SQL Server Express on the Delivery Controller'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: CITRIX_BUILD
  STORAGE_ACCOUNT: ctxmedia
  STORAGE_CONTAINER: cvad
  BLOB_PREFIX: x64/
  LOCAL_MEDIA_ROOT: C:\Source\CitrixCVAD
  CITRIX_BUILD_IDENTITY: CitrixBuildVMIdentity

jobs:
  install-ddc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify target VM and Citrix build identity
        uses: azure/powershell@v2
        env:
          VM_NAME: ${{ inputs.vmName }}
          EXPECTED_IDENTITY: ${{ env.CITRIX_BUILD_IDENTITY }}
        with:
          azPSVersion: latest
          inlineScript: |
            $vm = Get-AzVM -ResourceGroupName $env:RESOURCE_GROUP -Name $env:VM_NAME -ErrorAction Stop
            Write-Output "Target VM: $($vm.Name)"

            if ($null -eq $vm.Identity -or $vm.Identity.Type -notmatch 'UserAssigned') {
              throw "VM '$($vm.Name)' does not have a user-assigned managed identity attached. Expected '$env:EXPECTED_IDENTITY'."
            }

            $identity = Get-AzUserAssignedIdentity `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -Name $env:EXPECTED_IDENTITY `
              -ErrorAction Stop

            if ($null -eq $vm.Identity.UserAssignedIdentities.Keys -or $vm.Identity.UserAssignedIdentities.Keys -notcontains $identity.Id) {
              throw "VM '$($vm.Name)' is not using '$env:EXPECTED_IDENTITY'. Attach the Citrix build managed identity before running this workflow."
            }

            Write-Output "Verified managed identity: $($identity.Name)"
            Write-Output "Identity principal ID: $($identity.PrincipalId)"

      - name: Install Citrix Delivery Controller
        uses: azure/powershell@v2
        env:
          VM_NAME: ${{ inputs.vmName }}
          INSTALL_SQL: ${{ inputs.installSqlExpress }}
        with:
          azPSVersion: latest
          inlineScript: |
            $parameters = @{
              StorageAccountName = $env:STORAGE_ACCOUNT
              StorageContainer   = $env:STORAGE_CONTAINER
              BlobPrefix         = $env:BLOB_PREFIX
              LocalMediaRoot     = $env:LOCAL_MEDIA_ROOT
              InstallSqlExpress  = $env:INSTALL_SQL
            }

            Write-Output "Installing Citrix Delivery Controller on $env:VM_NAME..."
            Write-Output "Media: $env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER/$env:BLOB_PREFIX"
            Write-Output "Local media: $env:LOCAL_MEDIA_ROOT"
            Write-Output "SQL Express: $env:INSTALL_SQL"

            $result = Invoke-AzVMRunCommand `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName $env:VM_NAME `
              -CommandId 'RunPowerShellScript' `
              -ScriptPath './Scripts/Install-Citrix-DDC.ps1' `
              -Parameter $parameters

            $result.Value | ForEach-Object {
              Write-Output $_.Message
            }

      - name: DDC installation complete
        shell: pwsh
        run: |
          Write-Output "Citrix Delivery Controller installation workflow completed for ${{ inputs.vmName }}."
