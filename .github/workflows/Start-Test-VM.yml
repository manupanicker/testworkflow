name: Start Test VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_RESOURCE_GROUP: CITRIX_BUILD
  AZURE_VM_NAME: ALFAQMGTDC01

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Check VM state
        shell: pwsh
        run: |
          $vm = Get-AzVM -ResourceGroupName $env:AZURE_RESOURCE_GROUP -Name $env:AZURE_VM_NAME -Status
          $powerState = ($vm.Statuses | Where-Object { $_.Code -like 'PowerState/*' }).DisplayStatus
          Write-Host "VM: $env:AZURE_VM_NAME"
          Write-Host "Resource Group: $env:AZURE_RESOURCE_GROUP"
          Write-Host "Current state: $powerState"

      - name: Start VM
        shell: pwsh
        run: |
          $vm = Get-AzVM -ResourceGroupName $env:AZURE_RESOURCE_GROUP -Name $env:AZURE_VM_NAME -Status
          $powerState = ($vm.Statuses | Where-Object { $_.Code -like 'PowerState/*' }).Code

          if ($powerState -eq 'PowerState/running') {
            Write-Host "VM is already running. No action required."
          } else {
            Write-Host "Starting $env:AZURE_VM_NAME..."
            Start-AzVM -ResourceGroupName $env:AZURE_RESOURCE_GROUP -Name $env:AZURE_VM_NAME
            Write-Host "Start command completed."
          }
