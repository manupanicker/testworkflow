name: Install Citrix Licensing

on:
  workflow_dispatch:
    inputs:
      vmName:
        description: 'Existing Azure VM name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: CITRIX_BUILD
  STORAGE_ACCOUNT: ctxmedia
  STORAGE_CONTAINER: cvad

jobs:
  install-licensing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify target VM
        shell: pwsh
        env:
          VM_NAME: ${{ inputs.vmName }}
        run: |
          $vm = Get-AzVM -ResourceGroupName $env:RESOURCE_GROUP -Name $env:VM_NAME -ErrorAction Stop
          Write-Output "Target VM: $($vm.Name)"
          Write-Output "Power state: $((Get-AzVM -ResourceGroupName $env:RESOURCE_GROUP -Name $env:VM_NAME -Status).Statuses | Where-Object Code -like 'PowerState/*' | Select-Object -ExpandProperty DisplayStatus)"

      - name: Create short-lived Blob SAS
        uses: azure/powershell@v2
        env:
          STORAGE_ACCOUNT: ${{ env.STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ env.STORAGE_CONTAINER }}
        with:
          azPSVersion: latest
          inlineScript: |
            $ctx = New-AzStorageContext -StorageAccountName $env:STORAGE_ACCOUNT -UseConnectedAccount

            $startTime = (Get-Date).ToUniversalTime().AddMinutes(-5)
            $expiryTime = (Get-Date).ToUniversalTime().AddHours(2)

            # Generate a user-delegation SAS token. Do not pass the raw SAS
            # through Run Command because '&' is a reserved character for the
            # Windows Run Command extension.
            $sasToken = New-AzStorageContainerSASToken `
              -Context $ctx `
              -Name $env:STORAGE_CONTAINER `
              -Permission rl `
              -Protocol HttpsOnly `
              -StartTime $startTime `
              -ExpiryTime $expiryTime

            if ([string]::IsNullOrWhiteSpace($sasToken)) {
              throw 'Failed to generate a Blob user-delegation SAS token.'
            }

            $sasToken = $sasToken.TrimStart('?')
            $sasBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($sasToken))

            Write-Output 'Short-lived Blob SAS generated successfully.'
            "::add-mask::$sasBase64"
            "BLOB_SAS_BASE64=$sasBase64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Citrix Licensing with Azure VM Run Command
        uses: azure/powershell@v2
        env:
          VM_NAME: ${{ inputs.vmName }}
          BLOB_SAS_BASE64: ${{ env.BLOB_SAS_BASE64 }}
        with:
          azPSVersion: latest
          inlineScript: |
            $parameters = @{
              BlobSasBase64 = $env:BLOB_SAS_BASE64
            }

            $result = Invoke-AzVMRunCommand `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName $env:VM_NAME `
              -CommandId 'RunPowerShellScript' `
              -ScriptPath './Scripts/Install-Citrix-Licensing.ps1' `
              -Parameter $parameters

            $result.Value | ForEach-Object {
              Write-Output $_.Message
            }

      - name: Installation complete
        shell: pwsh
        run: |
          Write-Output "Citrix Licensing installation workflow completed for ${{ inputs.vmName }}."
