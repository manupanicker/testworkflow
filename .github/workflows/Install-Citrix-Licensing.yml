name: Install Citrix Licensing

on:
  workflow_dispatch:
    inputs:
      vmName:
        description: 'Existing Azure VM name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: CITRIX_BUILD
  STORAGE_ACCOUNT: ctxmedia
  STORAGE_CONTAINER: cvad
  BLOB_PREFIX: Licensing/

jobs:
  install-licensing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify target VM
        shell: pwsh
        env:
          VM_NAME: ${{ inputs.vmName }}
        run: |
          $vm = Get-AzVM -ResourceGroupName $env:RESOURCE_GROUP -Name $env:VM_NAME -ErrorAction Stop
          Write-Output "Target VM: $($vm.Name)"
          Write-Output "Power state: $((Get-AzVM -ResourceGroupName $env:RESOURCE_GROUP -Name $env:VM_NAME -Status).Statuses | Where-Object Code -like 'PowerState/*' | Select-Object -ExpandProperty DisplayStatus)"

      - name: Prepare Citrix Licensing media URLs
        uses: azure/powershell@v2
        env:
          STORAGE_ACCOUNT: ${{ env.STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ env.STORAGE_CONTAINER }}
          BLOB_PREFIX: ${{ env.BLOB_PREFIX }}
        with:
          azPSVersion: latest
          inlineScript: |
            $ctx = New-AzStorageContext -StorageAccountName $env:STORAGE_ACCOUNT -UseConnectedAccount

            $startTime = (Get-Date).ToUniversalTime().AddMinutes(-5)
            $expiryTime = (Get-Date).ToUniversalTime().AddHours(2)

            # Enumerate the private container using the GitHub Azure identity.
            # The VM does not need Storage permissions and does not need to list the container.
            $blobs = @(Get-AzStorageBlob `
              -Context $ctx `
              -Container $env:STORAGE_CONTAINER `
              -Prefix $env:BLOB_PREFIX `
              -ErrorAction Stop)

            $files = @($blobs | Where-Object { -not $_.Name.EndsWith('/') })

            if (-not $files -or $files.Count -eq 0) {
              throw "No blobs found under $($env:BLOB_PREFIX) in $($env:STORAGE_CONTAINER)."
            }

            $downloadUris = foreach ($blob in $files) {
              Write-Output "Preparing SAS URL for: $($blob.Name)"

              New-AzStorageBlobSASToken `
                -Context $ctx `
                -Container $env:STORAGE_CONTAINER `
                -Blob $blob.Name `
                -Permission r `
                -Protocol HttpsOnly `
                -StartTime $startTime `
                -ExpiryTime $expiryTime `
                -FullUri
            }

            $json = @($downloadUris) | ConvertTo-Json -Compress
            $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))

            "::add-mask::$base64"
            "BLOB_URIS_BASE64=$base64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            Write-Output "Prepared $($files.Count) Citrix Licensing media file(s)."

      - name: Install Citrix Licensing with Azure VM Run Command
        uses: azure/powershell@v2
        env:
          VM_NAME: ${{ inputs.vmName }}
          BLOB_URIS_BASE64: ${{ env.BLOB_URIS_BASE64 }}
        with:
          azPSVersion: latest
          inlineScript: |
            if ([string]::IsNullOrWhiteSpace($env:BLOB_URIS_BASE64)) {
              throw 'BLOB_URIS_BASE64 was not populated.'
            }

            $parameters = @{
              BlobUrisBase64 = $env:BLOB_URIS_BASE64
            }

            $result = Invoke-AzVMRunCommand `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName $env:VM_NAME `
              -CommandId 'RunPowerShellScript' `
              -ScriptPath './Scripts/Install-Citrix-Licensing.ps1' `
              -Parameter $parameters

            $result.Value | ForEach-Object {
              Write-Output $_.Message
            }

      - name: Installation complete
        shell: pwsh
        run: |
          Write-Output "Citrix Licensing installation workflow completed for ${{ inputs.vmName }}."
