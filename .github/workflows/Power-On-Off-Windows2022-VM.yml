name: Power On or Off Windows 2022 VM

on:
  workflow_dispatch:
    inputs:
      vmName:
        description: 'Azure VM name'
        required: true
        type: string
      powerAction:
        description: 'Power action to perform'
        required: true
        type: choice
        options:
          - start
          - stop
        default: start

  repository_dispatch:
    types:
      - citrix-power

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: CITRIX_BUILD
  VM_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.vmName || inputs.vmName }}
  POWER_ACTION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.powerAction || inputs.powerAction }}

jobs:
  power-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Show requested operation
        shell: bash
        run: |
          echo "VM: $VM_NAME"
          echo "Action: $POWER_ACTION"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify VM exists
        shell: bash
        run: |
          az vm show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --query name \
            --output tsv

      - name: Power on VM
        if: env.POWER_ACTION == 'start'
        shell: bash
        run: |
          az vm start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME"

      - name: Power off VM
        if: env.POWER_ACTION == 'stop'
        shell: bash
        run: |
          az vm deallocate \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME"

      - name: Show VM power state
        shell: bash
        run: |
          az vm get-instance-view \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
            --output tsv
