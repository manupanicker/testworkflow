name: List VMs in Azure Subscription

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  list-vms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: List VMs
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $ErrorActionPreference = "Stop"

            Write-Output "Azure Context:"
            Get-AzContext

            Write-Output ""
            Write-Output "VMs in subscription:"
            Write-Output "===================="

            $vms = Get-AzVM

            if (-not $vms) {
                Write-Output "No VMs found."
                exit 0
            }

            $vms |
              Select-Object Name, ResourceGroupName, Location, @{Name="VMSize"; Expression={$_.HardwareProfile.VmSize}} |
              Sort-Object ResourceGroupName, Name |
              Format-Table -AutoSize

            Write-Output ""
            Write-Output "Total VMs: $($vms.Count)"
