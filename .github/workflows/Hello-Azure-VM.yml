name: Hello World Azure VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify script exists
        shell: bash
        run: |
          ls -la Scripts
          test -f ./Scripts/HelloWorld.ps1

      - name: Run HelloWorld.ps1 on Azure VM
        uses: azure/cli@v2
        with:
          inlineScript: |
            $script = Get-Content ./Scripts/HelloWorld.ps1 -Raw

            az vm run-command invoke `
              --resource-group CITRIX_BUILD `
              --name ALFAQMGTDC01 `
              --command-id RunPowerShellScript `
              --scripts "$script"
