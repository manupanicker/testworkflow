name: Hello World Azure VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify script exists
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Scripts directory:"
          ls -la ./Scripts
          echo ""
          echo "Checking HelloWorld.ps1..."
          test -f ./Scripts/HelloWorld.ps1
          echo "HelloWorld.ps1 found successfully."

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        shell: bash
        run: |
          az account show --output table

      - name: Run HelloWorld.ps1 on Azure VM
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Reading Scripts/HelloWorld.ps1..."
            script=$(cat ./Scripts/HelloWorld.ps1)

            echo "Executing HelloWorld.ps1 on ALFAQMGTDC01..."

            az vm run-command invoke \
              --resource-group CITRIX_BUILD \
              --name ALFAQMGTDC01 \
              --command-id RunPowerShellScript \
              --scripts "$script"
